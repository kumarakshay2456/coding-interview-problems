<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading note…</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #080c16;
  --surface: #0d1117;
  --card: #161c2a;
  --border: #232d42;
  --accent: #818cf8;
  --text: #e2e8f0;
  --muted: #64748b;
  --muted2: #94a3b8;
  --code-bg: #0d1117;
  --blockquote: rgba(129, 140, 248, 0.12);
}
[data-theme="light"] {
  --bg: #f1f5f9;
  --surface: #f8fafc;
  --card: #ffffff;
  --border: #cbd5e1;
  --accent: #4f46e5;
  --text: #0f172a;
  --muted: #64748b;
  --muted2: #475569;
  --code-bg: #e2e8f0;
  --blockquote: rgba(99, 102, 241, 0.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}

.toolbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 20px;
  background:rgba(8,12,22,.92);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
[data-theme="light"] .toolbar{background:rgba(248,250,252,.96)}
.toolbar a{
  font-size:13px;font-weight:600;color:var(--muted2);text-decoration:none;
  padding:6px 12px;border-radius:8px;border:1px solid var(--border);transition:all .15s;
}
.toolbar a:hover{color:var(--text);border-color:var(--accent);background:rgba(129,140,248,.08)}
.toolbar .title{
  flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.toolbar .meta{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.toolbar button{
  background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:8px;
  padding:6px 12px;cursor:pointer;font-size:15px;color:var(--text);
}
[data-theme="light"] .toolbar button{background:rgba(0,0,0,.06)}

.wrap{max-width:820px;margin:0 auto;padding:32px 24px 80px}

.article{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:36px 40px;box-shadow:0 4px 24px rgba(0,0,0,.12);
}
[data-theme="light"] .article{box-shadow:0 2px 12px rgba(0,0,0,.06)}

.md{font-size:16px;color:var(--text);line-height:1.75}
.md h1{font-size:1.75rem;font-weight:800;margin:0 0 1rem;line-height:1.25;color:var(--text)}
.md h2{font-size:1.35rem;font-weight:700;margin:2rem 0 .75rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)}
.md h3{font-size:1.15rem;font-weight:700;margin:1.5rem 0 .5rem;color:var(--accent)}
.md h4,.md h5,.md h6{font-size:1rem;font-weight:600;margin:1.25rem 0 .4rem}
.md p{margin:.85em 0}
.md ul,.md ol{margin:.85em 0;padding-left:1.35em}
.md li{margin:.35em 0}
.md a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.md a:hover{opacity:.9}
.md blockquote{
  margin:1.2em 0;padding:.6em 1em .6em 1rem;border-left:4px solid var(--accent);
  background:var(--blockquote);border-radius:0 8px 8px 0;color:var(--muted2);font-size:.95em
}
.md hr{display:none}
.md > h1:first-child + hr{display:block;border:none;height:1px;background:var(--border);margin:0 0 1.5rem}
.md code{
  font-family:'JetBrains Mono',monospace;font-size:.88em;
  background:rgba(129,140,248,.12);padding:.15em .45em;border-radius:6px;color:var(--accent);
}
[data-theme="light"] .md code{background:rgba(79,70,229,.12);color:#4f46e5}
.md pre{
  margin:1.2em 0;padding:16px 18px;border-radius:10px;background:var(--code-bg);
  border:1px solid var(--border);overflow-x:auto;line-height:1.65
}
.md pre code{background:none;padding:0;color:inherit;font-size:.85em}
.md table{width:100%;border-collapse:collapse;margin:1.2em 0;font-size:.92em}
.md th,.md td{border:1px solid var(--border);padding:10px 12px;text-align:left}
.md th{background:rgba(129,140,248,.08);font-weight:600;color:var(--muted2);font-size:.85em;text-transform:uppercase;letter-spacing:.03em}
[data-theme="light"] .md th{background:rgba(0,0,0,.04)}
.md tr:nth-child(even) td{background:rgba(255,255,255,.02)}
[data-theme="light"] .md tr:nth-child(even) td{background:rgba(0,0,0,.02)}
.md img{max-width:100%;border-radius:8px;margin:1em 0}

.state{text-align:center;padding:48px 24px;color:var(--muted)}
.state.err{color:#f87171}
.spinner{
  width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px
}
@keyframes spin{to{transform:rotate(360deg)}}

.raw-link{font-size:12px;margin-top:20px;text-align:center}
.raw-link a{color:var(--muted)}
</style>
</head>
<body>
<header class="toolbar">
  <a href="system_design.html">← SD Prep</a>
  <span class="title" id="docTitle">Markdown</span>
  <span class="meta" id="docMeta"></span>
  <button type="button" id="themeBtn" title="Toggle theme">🌙</button>
</header>

<div class="wrap">
  <div id="loading" class="state"><div class="spinner"></div>Loading note…</div>
  <div id="error" class="state err" style="display:none"></div>
  <article id="article" class="article" style="display:none">
    <div id="content" class="md"></div>
    <p class="raw-link"><a id="rawLink" href="#" target="_blank" rel="noopener">View raw on GitHub</a></p>
  </article>
</div>

<script>
(function () {
  const ALLOWED_HOST = 'raw.githubusercontent.com';
  const GITHUB_RAW_BASE = 'https://raw.githubusercontent.com/kumarakshay2456/coding-interview-problems/master/';
  const PATH_OK = /^interview_prep\/[a-zA-Z0-9_./-]+\.md$/;

  function getQueryUrl() {
    const p = new URLSearchParams(location.search).get('url');
    if (!p) return null;
    try {
      const u = new URL(p);
      if (u.protocol !== 'https:' || u.hostname !== ALLOWED_HOST) return null;
      return u.href;
    } catch (e) {
      return null;
    }
  }

  function getQueryPath() {
    const p = new URLSearchParams(location.search).get('path');
    if (!p) return null;
    try {
      const decoded = decodeURIComponent(p);
      if (decoded.indexOf('..') !== -1 || !PATH_OK.test(decoded)) return null;
      return decoded;
    } catch (e) {
      return null;
    }
  }

  function localFileUrl(repoRelativeMd) {
    return new URL('../' + repoRelativeMd, location.href).href;
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeBtn').textContent = theme === 'light' ? '☀️' : '🌙';
  }

  function fileNameFromPath(path) {
    const seg = path.split('/').filter(Boolean);
    return seg.length ? seg[seg.length - 1] : 'note';
  }

  document.getElementById('themeBtn').onclick = function () {
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    localStorage.setItem('dsa_theme', next);
    applyTheme(next);
  };

  applyTheme(localStorage.getItem('dsa_theme') || 'dark');

  var repoPath = getQueryPath();
  var explicitUrl = getQueryUrl();
  var loading = document.getElementById('loading');
  var errEl = document.getElementById('error');
  var article = document.getElementById('article');
  var content = document.getElementById('content');
  var docTitle = document.getElementById('docTitle');
  var docMeta = document.getElementById('docMeta');
  var rawLink = document.getElementById('rawLink');

  if (!repoPath && !explicitUrl) {
    loading.style.display = 'none';
    errEl.style.display = 'block';
    errEl.innerHTML =
      'Missing <code style="font-size:12px">?path=</code> or <code style="font-size:12px">?url=</code>. Open a note link from <a href="system_design.html" style="color:var(--accent)">System Design prep</a>.';
    return;
  }

  var tryUrls = [];
  if (repoPath) {
    tryUrls.push({ href: localFileUrl(repoPath), label: 'local copy' });
    tryUrls.push({ href: GITHUB_RAW_BASE + repoPath, label: 'GitHub' });
  }
  if (explicitUrl) {
    var dup = tryUrls.some(function (x) { return x.href === explicitUrl; });
    if (!dup) tryUrls.push({ href: explicitUrl, label: 'GitHub' });
  }

  rawLink.href = repoPath ? GITHUB_RAW_BASE + repoPath : explicitUrl;
  docMeta.textContent = repoPath ? fileNameFromPath(repoPath) : fileNameFromPath(new URL(explicitUrl).pathname);

  marked.setOptions({ gfm: true, breaks: true });

  function tryLoad(index) {
    if (index >= tryUrls.length) {
      loading.style.display = 'none';
      errEl.style.display = 'block';
      errEl.innerHTML =
        '<div style="max-width:520px;margin:0 auto;font-weight:600">Could not load this note from any source.</div>' +
        '<p style="margin-top:14px;font-size:14px;color:var(--muted);line-height:1.6">' +
        '<b>If the browser showed “Error code: 404 / File not found” on a blank page</b> — that is usually Python’s server: the URL path was wrong. Start the server from the <b>repository root</b> (the folder that contains both <code style="font-size:12px">docs</code> and <code style="font-size:12px">interview_prep</code>), then open:<br><br>' +
        '<code style="font-size:12px">http://localhost:8000/docs/system_design.html</code><br><br>' +
        'Do not use <code style="font-size:12px">/md-viewer.html</code> without the <code style="font-size:12px">docs/</code> prefix unless you started the server <em>inside</em> <code style="font-size:12px">docs</code>.</p>';
      return;
    }
    var entry = tryUrls[index];
    fetch(entry.href)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (text) {
        loading.style.display = 'none';
        article.style.display = 'block';
        content.innerHTML = marked.parse(text);
        var h1 = content.querySelector('h1');
        var baseName = repoPath ? fileNameFromPath(repoPath) : fileNameFromPath(new URL(entry.href).pathname);
        if (h1 && h1.textContent) docTitle.textContent = h1.textContent.trim();
        else docTitle.textContent = baseName.replace(/\.md$/i, '');
        document.title = docTitle.textContent + ' · SD Prep';
        docMeta.textContent = baseName + ' · via ' + entry.label;
      })
      .catch(function () {
        tryLoad(index + 1);
      });
  }

  tryLoad(0);
})();
</script>
</body>
</html>
